 name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Clean & Build Complete App
        run: |
          rm -rf gradle/wrapper build.gradle settings.gradle gradle.properties app/build.gradle app/src/main
          mkdir -p gradle/wrapper app/src/main/java/com/aimbot/vip app/src/main/res/values app/src/main/res/layout

          # 1. Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. Settings
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AimAiEngine"
          include ':app'
          EOF

          # 3. Root Build
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. App Module Build
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimbot.vip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.aimbot.vip"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:label="AimEngine VIP"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AimService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

          # 6. Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AimEngine VIP</string>
          </resources>
          EOF

          # 7. Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp"
              android:background="#121212">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="AimEngine VIP"
                  android:textColor="#00FF66"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="16dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Super Precise Aim Guide Overlay"
                  android:textColor="#AAAAAA"
                  android:textSize="14sp"
                  android:layout_marginBottom="36dp" />

              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="START AIM ENGINE"
                  android:textStyle="bold"
                  android:textSize="16sp"
                  android:backgroundTint="#00FF66"
                  android:textColor="#000000" />

              <Button
                  android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="55dp"
                  android:layout_marginTop="12dp"
                  android:text="STOP ENGINE"
                  android:textColor="#FF4444"
                  android:backgroundTint="#2A2A2A" />

          </LinearLayout>
          EOF

          # 8. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/aimbot/vip/MainActivity.java
          package com.aimbot.vip;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private static final int OVERLAY_PERMISSION_REQ_CODE = 1234;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnStart = findViewById(R.id.btnStart);
                  Button btnStop = findViewById(R.id.btnStop);

                  btnStart.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName()));
                          startActivityForResult(intent, OVERLAY_PERMISSION_REQ_CODE);
                          Toast.makeText(MainActivity.this, "Grant Overlay Permission", Toast.LENGTH_LONG).show();
                      } else {
                          startAimService();
                      }
                  });

                  btnStop.setOnClickListener(v -> {
                      Intent serviceIntent = new Intent(MainActivity.this, AimService.class);
                      stopService(serviceIntent);
                      Toast.makeText(MainActivity.this, "Aim Engine Stopped", Toast.LENGTH_SHORT).show();
                  });
              }

              private void startAimService() {
                  Intent serviceIntent = new Intent(MainActivity.this, AimService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
                  Toast.makeText(this, "Aim Engine Activated!", Toast.LENGTH_SHORT).show();
              }
          }
          EOF

          # 9. OverlayView.java
          cat << 'EOF' > app/src/main/java/com/aimbot/vip/OverlayView.java
          package com.aimbot.vip;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.view.View;

          public class OverlayView extends View {
              private Paint linePaint;
              private Paint circlePaint;

              public OverlayView(Context context) {
                  super(context);
                  init();
              }

              private void init() {
                  linePaint = new Paint();
                  linePaint.setColor(Color.GREEN);
                  linePaint.setStrokeWidth(4f);
                  linePaint.setStyle(Paint.Style.STROKE);
                  linePaint.setAntiAlias(true);

                  circlePaint = new Paint();
                  circlePaint.setColor(Color.RED);
                  circlePaint.setStyle(Paint.Style.FILL);
                  circlePaint.setAntiAlias(true);
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int cx = getWidth() / 2;
                  int cy = getHeight() / 2;

                  // Guidelines
                  canvas.drawLine(cx, cy, cx, 0, linePaint);
                  canvas.drawLine(cx, cy, getWidth(), cy, linePaint);
                  canvas.drawLine(cx, cy, 0, cy, linePaint);
                  canvas.drawLine(cx, cy, cx, getHeight(), linePaint);

                  // Center indicator
                  canvas.drawCircle(cx, cy, 14f, circlePaint);
              }
          }
          EOF

          # 10. AimService.java
          cat << 'EOF' > app/src/main/java/com/aimbot/vip/AimService.java
          package com.aimbot.vip;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.WindowManager;
          import androidx.core.app.NotificationCompat;

          public class AimService extends Service {
              private WindowManager windowManager;
              private OverlayView overlayView;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      String CHANNEL_ID = "aim_channel_01";
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Aim Service", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }

                      Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                              .setContentTitle("AimEngine Active")
                              .setContentText("Overlay guide running")
                              .setSmallIcon(android.R.drawable.ic_menu_compass)
                              .build();

                      startForeground(1, notification);
                  }

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  overlayView = new OverlayView(this);

                  int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O 
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY 
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.LEFT;

                  if (windowManager != null) {
                      windowManager.addView(overlayView, params);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (windowManager != null && overlayView != null) {
                      windowManager.removeView(overlayView);
                  }
              }
          }
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: AimEngine-VIP
          path: app/build/outputs/apk/debug/*.apk
          
