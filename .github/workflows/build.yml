name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK Directly
        run: |
          mkdir -p build/gen build/obj build/apk
          
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          
          $AAPT package -f -m -J build/gen -M app/src/main/AndroidManifest.xml -I "$PLATFORM"
          
          javac -d build/obj -cp "$PLATFORM" $(find app/src/main/java build/gen -name "*.java")
          
          $D8 --output build/ $(find build/obj -name "*.class")
          
          $AAPT package -f -M app/src/main/AndroidManifest.xml -I "$PLATFORM" -F build/unaligned.apk
          
          cd build
          $AAPT add unaligned.apk classes.dex
          $ZIPALIGN -v -p 4 unaligned.apk AimEngine-VIP.apk
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android AimEngine-VIP.apk
          mkdir -p ../output
          mv AimEngine-VIP.apk ../output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimEngine-VIP
          path: output/AimEngine-VIP.apk
          
